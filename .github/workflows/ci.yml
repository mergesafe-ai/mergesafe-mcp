name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uv sync --locked
      - run: uv run python -c "import mergesafe_mcp.server, mergesafe_mcp.tools"
      - run: uv build
