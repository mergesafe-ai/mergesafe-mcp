[project]
name = "mergesafe-mcp"
version = "0.1.0"
description = "MergeSafe findings for your own coding agent, over MCP (stdio)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.scripts]
mergesafe-mcp = "mergesafe_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mergesafe_mcp"]
